name: Publish

# Publishes to npm when a version tag such as v0.1.0 is pushed. To publish a tag that
# already exists, run the workflow by hand and pass the tag.
#
# Authenticates with npm trusted publishing (GitHub OIDC), so the repository stores no npm
# token. The trusted publisher in the npm package settings names organization FireMQ,
# repository firemq-js and workflow publish.yml, and allows `npm publish`. npm expires a
# new trusted publisher that hasn't published within 2 days of being added; if the package
# settings show it as expired, delete it and add it again before releasing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    env:
      # The pushed tag, or the tag passed to a manual run.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      # No dependency cache: a release build installs from the lockfile only.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the version $version in package.json"
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # npm provenance names the commit and ref the run started from (GITHUB_SHA and
      # GITHUB_REF), not the checked-out tag. A manual run started from a branch would
      # attest the wrong commit, so it publishes without provenance; trusted publishing adds
      # provenance by default, so that run turns it off. Start the manual run from the tag
      # ("Use workflow from") to keep provenance.
      - name: npm publish
        run: |
          if [ "$GITHUB_REF" = "refs/tags/$TAG" ]; then
            npm publish --access public --provenance
          else
            echo "::notice::Publishing $TAG without provenance because the run started from $GITHUB_REF, not refs/tags/$TAG"
            NPM_CONFIG_PROVENANCE=false npm publish --access public
          fi
